trigger:
  - main

pool:
  vmImage: 'windows-2019'

variables:
  buildConfiguration: 'release'

stages:
- stage: Build
  displayName: "Build Stage"
  jobs:
  - job: BuildJob
    displayName: "Restore and Build"
    steps:
    - task: DotNetCoreCLI@2
      displayName: "Restore NuGet Packages"
      inputs:
        command: 'restore'
        projects: '**/*.csproj'
